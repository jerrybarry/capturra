[package]
name = "capturra-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The capturra command line tool: record, preview, zoom, synth."

[[bin]]
name = "capturra"
path = "src/main.rs"

[dependencies]
capturra-core.workspace = true
capturra-render.workspace = true
capturra-recorder.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
